name: njuskalo-test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Runner IP
        run: curl -s https://ipinfo.io/json | grep -E '"(ip|org|city|country)"'

      - name: Install curl-impersonate
        run: |
          curl -sL https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz | tar xz
          ls

      - name: Plain curl (expected to be blocked)
        run: |
          curl -s -L -o plain.html -w "HTTP %{http_code} | %{size_download} B\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0 Safari/537.36" \
            "$URL"
          grep -o '<title>[^<]*' plain.html || true
        env:
          URL: https://www.njuskalo.hr/prodaja-stanova/split?price%5Bmin%5D=120000&price%5Bmax%5D=300000&livingArea%5Bmin%5D=35

      - name: curl-impersonate chrome146 (3 tries, 1 min apart)
        run: |
          for i in 1 2 3; do
            ./curl-impersonate --compressed --impersonate chrome146 -s -L -o imp.html -w "try $i: HTTP %{http_code} | %{size_download} B | %{url_effective}\n" "$URL" | cut -c1-140
            echo "  title: $(grep -o '<title>[^<]*' imp.html)"
            echo "  listings: $(grep -o 'EntityList-item--Regular' imp.html | wc -l)"
            [ $i -lt 3 ] && sleep 60
          done
        env:
          URL: https://www.njuskalo.hr/prodaja-stanova/split?price%5Bmin%5D=120000&price%5Bmax%5D=300000&livingArea%5Bmin%5D=35
