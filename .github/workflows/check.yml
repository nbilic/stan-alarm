name: check

on:
  schedule:
    - cron: '3-59/10 * * * *' # off the busy :00 slots
  workflow_dispatch:

# Never run two checks at once, otherwise both could notify about the same listing.
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cached so a run doesn't depend on GitHub's release downloads, which sometimes return 504
      # for hours. On a miss, `gh release download` goes through the API, a separate path that kept
      # working during such an outage.
      - name: Restore curl-impersonate
        id: ci-cache
        uses: actions/cache@v4
        with:
          path: ~/curl-impersonate
          key: curl-impersonate-v2.2.3

      - name: Install curl-impersonate
        if: steps.ci-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/curl-impersonate
          gh release download v2.2.3 -R lexiforest/curl-impersonate -p 'curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz' -O - | tar xz -C ~/curl-impersonate
        env:
          GH_TOKEN: ${{ github.token }}

      - run: echo "CURL_IMPERSONATE_BIN=$HOME/curl-impersonate/curl-impersonate" >> "$GITHUB_ENV"

      # State (seen listing ids) lives in the Actions cache. Caches are immutable, so each run
      # restores the newest one by prefix and saves a new one under its own run id.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check for new listings
        run: node src/main.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
